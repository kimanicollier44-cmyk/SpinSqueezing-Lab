name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Run pytest test suite
        run: python3 -m pytest -q

      - name: Run built-in checks
        run: python3 main.py checks

      - name: Run default demo
        run: python3 main.py

      - name: Verify HOLD gate exit code
        run: |
          set +e
          python3 main.py hold-demo
          rc=$?
          set -e
          test "$rc" -eq 2
          
